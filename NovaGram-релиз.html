   const old=prof.username.toLowerCase();await st.set('names',u.toLowerCase(),{phone:me});if(old!==u.toLowerCase())await st.del('names',old);prof={...prof,username:u};profs[me]=prof;await st.set('accts',me,prof);say('Юзернейм @'+u+' установлен');ui()}}
 async function inbox(){box.innerHTML=bk+H('Сообщения в поддержку')+'<div class="t" style="padding:8px">Загрузка…</div>';back(admin);

const PRICE={heart:15,bear:15,rocket:50,ring:100,cup:100,pepe:1000};
const MKT_FIXED={pepe:1000},mprice=(g,p)=>MKT_FIXED[g&&g.t]||p;
const gname=t=>(G[t]||{}).n||'Подарок';
const conf=(t,l,fn)=>{const m=modal(`<div style="padding:18px 16px;text-align:center"><div style="margin-bottom:14px">${t}</div><button class="btn" id="cy">${l}</button></div>`);m.querySelector('#cy').onclick=async()=>{m.remove();await fn()}};
async function mut(id,f){const a=await st.get('accts',id)||(id===me?prof:null);if(!a)return null;const b=f({...a});if(!b)return null;await st.set('accts',id,b);delete profs[id];if(id===me){prof=b;profs[me]=b}ui();return b}
async function syncMe(){try{if(!me||!prof)return;const f=await st.get('accts',me);if(f&&(f.stars!==prof.stars||JSON.stringify(f.gifts||[])!==JSON.stringify(prof.gifts||[]))){prof={...prof,stars:f.stars,gifts:f.gifts};profs[me]=prof;ui()}}catch(e){}}
let _dir={t:0,a:[],c:[],n:[],b:[]};
async function allDirs(){if(Date.now()-_dir.t<1500)return _dir;const g=c=>st.list(c).catch(()=>[]);const [a,c,n,b]=await Promise.all([g('accts'),g('chans'),g('names'),g('bots')]);_dir={t:Date.now(),a,c,n,b};return _dir}
async function findMany(v){const k=await findKey(v),out=k?[k]:[],s=String(v).trim().replace(/^@/,'').toLowerCase();
 if(s.length>=1&&!/^\d+$/.test(s)){const d=await allDirs(),A=new Map(d.a.map(a=>[a.id,a])),C=new Map(d.c.map(c=>[c.id,c])),B=new Map(d.b.map(b=>[b.id,b]));
  const hit=x=>((x.name||'')+' '+(x.username||'')).toLowerCase().includes(s),rank=x=>String(x.username||'').toLowerCase().startsWith(s)||String(x.name||'').toLowerCase().startsWith(s)?0:1,add=(id,o)=>{if(id&&id!==me&&!out.includes(id)&&out.length<150){if(o&&!profs[id])profs[id]=o;out.push(id)}};
  [...d.a].filter(a=>!a.banned&&!a.gone&&hit(a)).sort((x,y)=>rank(x)-rank(y)).forEach(a=>add(a.id,a));
  [...d.c].filter(hit).sort((x,y)=>rank(x)-rank(y)).forEach(c=>add('ch:'+c.id,{...c,ch:true}));
  [...d.b].filter(hit).forEach(b=>add('bot:'+b.id,{...b,bot:true}));
  for(const n of d.n){if(!String(n.id).includes(s))continue;
   if(n.phone){const a=A.get(n.phone);if(!a||(!a.banned&&!a.gone))add(n.phone,a)}
   else if(n.chan){const c=C.get(n.chan);if(c)add('ch:'+n.chan,{...c,ch:true})}
   else if(n.bot){const b=B.get(n.bot);if(b)add('bot:'+n.bot,{...b,bot:true})}}}
 return out.filter(Boolean)}
async function sendGift(t,to){const pr=PRICE[t];if(!pr)return false;if(to===me){toast('Нельзя подарить себе');return false}
 if(!await st.get('accts',to)){toast('Получатель не найден');return false}
 if(!await mut(me,a=>(a.stars||0)<pr?null:{...a,stars:(a.stars||0)-pr})){toast('Недостаточно звёзд: нужно '+pr+' ★');return false}
 const g=mkGift(t);g.from=me;await mut(to,a=>({...a,gifts:[...(a.gifts||[]),g]}));
 await st.add({from:me,to,text:'🎁 Подарок «'+gname(t)+'» · '+pr+' ★',ts:Date.now()});toast('Подарок отправлен');return true}
async function buyLot(id){const l=await st.get('market',id);if(!l){toast('Лот уже продан или снят');return false}if(l.seller===me){toast('Это ваш лот');return false}
 const pr=mprice(l.gift,Math.max(1,Math.floor(+l.price||0)));
 if(!await mut(me,a=>(a.stars||0)<pr?null:{...a,stars:(a.stars||0)-pr})){toast('Недостаточно звёзд: нужно '+pr+' ★');return false}
 if(!await st.get('market',id)){await mut(me,a=>({...a,stars:(a.stars||0)+pr}));toast('Лот уже продан');return false}
 await st.del('market',id);await mut(me,a=>({...a,gifts:[...(a.gifts||[]),l.gift]}));await mut(l.seller,a=>({...a,stars:(a.stars||0)+pr}));
 await st.add({from:me,to:l.seller,text:'🛍 Куплен подарок «'+gname(l.gift.t)+'» за '+pr+' ★',ts:Date.now()});return true}
async function listGift(g,price){const f=await st.get('accts',me)||prof,i=(f.gifts||[]).findIndex(x=>x.t===g.t&&x.n===g.n);if(i<0){toast('Подарок не найден');return false}
 const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await st.set('market',id,{seller:me,gift:f.gifts[i],price:mprice(f.gifts[i],price),ts:Date.now()});
 await mut(me,a=>({...a,gifts:(a.gifts||[]).filter((_,k)=>k!==i)}));return true}
async function unlist(id){const l=await st.get('market',id);if(!l||l.seller!==me){toast('Лот уже продан или снят');return false}await st.del('market',id);await mut(me,a=>({...a,gifts:[...(a.gifts||[]),l.gift]}));return true}
